name: Run Knowledge Base Graph Update

on:
  schedule:
    # Runs every 2 days at 3am UTC, which is a good approximation for every 48 hours.
    - cron: '0 3 */2 * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-graph:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./knowledge-base
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "knowledge-base/uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run graph update
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: uv run python main.py --actions graph 
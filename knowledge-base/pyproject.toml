[project]
name = "knowledge-base"
version = "0.1.0"
description = "Knowledge base builder for valkompass.ai"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bertopic==0.17.4",
    "nltk==3.9.4",
    "pdfplumber==0.11.9",
    "pydantic==2.13.4",
    "sentence-transformers==5.5.1",
    "langdetect==1.0.9",
    "scikit-learn==1.8.0",
    "tqdm==4.67.3",
    "langchain-text-splitters==1.1.2",
    "einops==0.8.2",
    "openai==2.38.0",
    "python-dotenv==1.2.2",
    "spacy==3.8.14",
    "pip==26.1.1",
    "neo4j==6.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.15",
]

[tool.setuptools]
packages = ["analysis", "documents", "graph", "model", "parser", "sources", "util", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
